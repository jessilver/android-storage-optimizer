name: Relatório de Bug
description: Relate um problema para nos ajudar a melhorar o app.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento inesperado.
    validations:
      required: true
  - type: textarea
    id: passos-para-reproduzir
    attributes:
      label: Como reproduzir?
      description: Quais passos levam a esse erro?
    validations:
      required: true
