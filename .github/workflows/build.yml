name: Build Android Optimizer Standalone

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Executável (Standalone Windows)
        run: |
          pyinstaller --noconsole --onefile --name="AndroidOptimizer" main.py

      - name: Salvar Artefato do Build
        uses: actions/upload-artifact@v4
        with:
          name: AndroidOptimizer-Windows
          path: dist/AndroidOptimizer.exe
